version: '3.8'

services:
  mysql:
    image: mysql:9.4
    container_name: ${COMPOSE_PROJECT_NAME:-core-microservices}-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-microservices_db}
      MYSQL_USER: ${DB_USERNAME:-admin}
      MYSQL_PASSWORD: ${DB_PASSWORD:-admin123}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db_ini/BaseDatos.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - ${NETWORK_NAME:-microservices-network}

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: ${COMPOSE_PROJECT_NAME:-core-microservices}-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_PORT:-2181}
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "bash", "-c", "echo 'ruok' | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ${NETWORK_NAME:-microservices-network}

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: ${COMPOSE_PROJECT_NAME:-core-microservices}-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: ${ZOOKEEPER_HOST:-zookeeper}:${ZOOKEEPER_PORT:-2181}
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ${NETWORK_NAME:-microservices-network}

  customers-service:
    build:
      context: ./core-customers-microservice
      dockerfile: Dockerfile
    image: core-customers-microservice:${CUSTOMERS_VERSION:-1.0.0}
    container_name: ${COMPOSE_PROJECT_NAME:-core-microservices}-customers
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "${CUSTOMERS_SERVICE_PORT:-8080}:8080"
    environment:
      # Database Configuration
      SPRING_DATASOURCE_URL: ${DB_URL:-jdbc:mysql://mysql:3306/microservices_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-admin}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-admin123}
      
      # Kafka Configuration
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_CUSTOMER_TOPIC: ${KAFKA_CUSTOMER_TOPIC:-customer.events}
      APP_KAFKA_CUSTOMER_TOPIC: ${KAFKA_CUSTOMER_TOPIC:-customer.events}
      
      # Spring Configuration
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SERVER_PORT: 8080
      
      # Logging Configuration
      LOGGING_LEVEL_ROOT: ${LOG_LEVEL:-INFO}
      LOGGING_PATTERN_CONSOLE: ${LOG_PATTERN:-%d{yyyy-MM-dd HH:mm:ss} - %msg%n}
      
      # Actuator Configuration
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:-health,info,metrics}
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:-always}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - ${NETWORK_NAME:-microservices-network}

  accounts-service:
    build:
      context: ./core-accounts-microservice
      dockerfile: Dockerfile
    image: core-accounts-microservice:${ACCOUNTS_VERSION:-1.0.0}
    container_name: ${COMPOSE_PROJECT_NAME:-core-microservices}-accounts
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      customers-service:
        condition: service_healthy
    ports:
      - "${ACCOUNTS_SERVICE_PORT:-8081}:8081"
    environment:
      # Database Configuration
      SPRING_DATASOURCE_URL: ${DB_URL:-jdbc:mysql://mysql:3306/microservices_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-admin}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-admin123}
      
      # Kafka Configuration
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_CUSTOMER_TOPIC: ${KAFKA_CUSTOMER_TOPIC:-customer.events}
      KAFKA_CONSUMER_GROUP_ID: ${KAFKA_CONSUMER_GROUP_ID:-accounts-service}
      
      # Spring Configuration
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SERVER_PORT: 8081
      
      # Logging Configuration
      LOGGING_LEVEL_ROOT: ${LOG_LEVEL:-INFO}
      LOGGING_PATTERN_CONSOLE: ${LOG_PATTERN:-%d{yyyy-MM-dd HH:mm:ss} - %msg%n}
      
      # Actuator Configuration
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:-health,info,metrics}
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:-always}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - ${NETWORK_NAME:-microservices-network}

volumes:
  mysql_data:
    driver: local

networks:
  microservices-network:
    name: ${NETWORK_NAME:-microservices-network}
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16