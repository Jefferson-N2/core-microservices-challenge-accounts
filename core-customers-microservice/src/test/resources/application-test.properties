# H2 Database Configuration for Tests (MySQL compatible mode)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA Configuration for Tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Disable JMX for Tests
spring.jmx.enabled=false

# Kafka Configuration for Tests (disable)
spring.kafka.bootstrap-servers=
spring.kafka.producer.bootstrap-servers=dummy:9092
spring.kafka.consumer.group-id=test-group

# Logging Configuration for Tests
logging.level.com.core.microservices.customers=INFO