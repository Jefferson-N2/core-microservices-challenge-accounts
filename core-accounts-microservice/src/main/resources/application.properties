# Server Configuration
server.port=${SERVER_PORT:8081}

# Application Configuration
spring.application.name=${SPRING_APPLICATION_NAME:accounts-service}

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/microservices_db}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:admin123}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=${DB_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=${DB_HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}
spring.jpa.properties.hibernate.format_sql=${DB_FORMAT_SQL:true}

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_MIN_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}

# Kafka Configuration

# Kafka Consumer Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.consumer.group-id=${SPRING_KAFKA_CONSUMER_GROUP_ID:accounts-service-v3}
spring.kafka.consumer.key-deserializer=${KAFKA_CONSUMER_KEY_DESERIALIZER:org.springframework.kafka.support.serializer.ErrorHandlingDeserializer}
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=${KAFKA_CONSUMER_KEY_DELEGATE_CLASS:org.apache.kafka.common.serialization.StringDeserializer}
spring.kafka.consumer.value-deserializer=${KAFKA_CONSUMER_VALUE_DESERIALIZER:org.springframework.kafka.support.serializer.ErrorHandlingDeserializer}
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=${KAFKA_CONSUMER_VALUE_DELEGATE_CLASS:org.springframework.kafka.support.serializer.JsonDeserializer}
spring.kafka.consumer.properties.spring.json.trusted.packages=${KAFKA_CONSUMER_TRUSTED_PACKAGES:*}
spring.kafka.consumer.properties.spring.json.use.type.headers=${KAFKA_CONSUMER_USE_TYPE_HEADERS:false}
spring.kafka.consumer.properties.spring.json.value.default.type=${KAFKA_CONSUMER_DEFAULT_TYPE:com.core.microservices.accounts.infrastructure.input.event.CustomerEvent}

spring.kafka.consumer.auto-offset-reset=${KAFKA_CONSUMER_AUTO_OFFSET_RESET:latest}
spring.kafka.consumer.enable-auto-commit=${KAFKA_CONSUMER_ENABLE_AUTO_COMMIT:true}
app.kafka.customer-topic=${KAFKA_CUSTOMER_TOPIC:customer.events}

# Management Configuration
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics}
management.endpoint.health.show-details=${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:always}

# SpringDoc Configuration
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}

# Logging Configuration
logging.level.com.core.microservices.accounts=${LOG_LEVEL:INFO}
logging.level.org.springframework.kafka=${KAFKA_LOG_LEVEL:WARN}
logging.pattern.console=${LOG_PATTERN:%d{yyyy-MM-dd HH:mm:ss} - %msg%n}

# External Services Configuration
app.external-services.customers-service.url=${CUSTOMERS_SERVICE_URL:http://customers-service:8080}
app.external-services.customers-service.timeout=${CUSTOMERS_SERVICE_TIMEOUT:5000}
app.external-services.customers-service.retry-attempts=${CUSTOMERS_SERVICE_RETRY:3}